name: Android debug APK
on:
  push:
    branches: ['main', 'feature/**', 'fix/**']
    tags: ['v*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Reuse optional debug signing identity
        env:
          DEBUG_STORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_STORE" ]; then
            printf '%s' "$DEBUG_STORE" | base64 --decode > "$RUNNER_TEMP/photosync-debug.keystore"
            echo "PHOTOSYNC_DEBUG_KEYSTORE=$RUNNER_TEMP/photosync-debug.keystore" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-Android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/lint-results-debug.html
