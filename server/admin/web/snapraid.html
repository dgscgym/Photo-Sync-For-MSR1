<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapRAID 设置 · 服务端管理台</title><link rel="stylesheet" href="/admin/assets/setup.css"></head><body><header><a href="/admin">◈ PhotoSync Admin</a><a href="/admin">返回管理台</a></header><main><p class="eyebrow">STORAGE SETTINGS</p><h1>SnapRAID 设置</h1><p>单独管理多盘保护，不改变照片目录、管理员账户或初始化状态。</p><div id="message" role="status"></div><div class="panel"><h2>当前保护状态</h2><p id="status"></p><button id="check">立即检查</button><h2>磁盘与保护模式</h2><label for="mode">模式</label><select id="mode"><option value="single">单校验</option><option value="double">双校验</option><option value="triple">三校验</option></select><label for="interval">后续检查周期（秒）</label><input id="interval" type="number" min="30" max="86400" value="3600"><button id="reload">刷新磁盘与配置</button><div id="disks"></div><div id="current"></div><button id="preview" class="primary">检查修改</button><div id="proposal"></div><button id="save" class="primary" disabled>保存 SnapRAID 设置</button><p>当前可调整尚未同步的磁盘方案。已接入运行中的阵列保持只读，避免将配置修改误当作安全的数据迁移。</p><p>保存不会自动同步，不格式化磁盘。照片目录、登录会话及初始化完成标记保持不变。</p></div></main><script src="/admin/assets/snapraid.js" defer></script></body></html>
