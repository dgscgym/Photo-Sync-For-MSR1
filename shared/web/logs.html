<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运行日志 · PhotoSync</title><link rel="stylesheet" href="/shared/assets/settings.css"><link rel="stylesheet" href="/shared/assets/profile.css"></head><body><header><a href="__HOME__">◈ PhotoSync __LABEL__</a><div class="user-profile"><button id="user-toggle" class="user-toggle" aria-expanded="false" aria-controls="user-menu" aria-haspopup="true"><span id="user-avatar" class="user-avatar">U</span><span id="user-name">用户信息</span><span aria-hidden="true">⌄</span></button><div id="user-menu" class="user-menu" hidden><strong id="profile-name">用户</strong><small id="profile-role">用户账户</small><a id="user-settings" href="__SETTINGS__">设置</a><a id="user-logs" href="__HOME__/logs">运行日志</a><button id="logout">退出登录</button><p id="profile-error" role="status"></p></div></div></header><main><a href="__HOME__">← 返回</a><h1>运行日志</h1><p id="log-message" role="status"></p><div class="section-title"><h2>运行日志</h2><button id="export-logs">导出已加载日志 JSON</button></div><div class="log-filters"><label>来源 <select id="log-category"><option value="">全部</option><option value="upload">上传记录</option><option value="snapraid">SnapRAID 记录</option><option value="library">目录导入记录</option></select></label><label>级别 <select id="log-level"><option value="">全部</option><option value="INFO">INFO</option><option value="DEBUG">DEBUG</option><option value="WARN">WARN</option><option value="ERROR">ERROR</option></select></label><button id="refresh-logs">刷新</button></div><p>记录包含时间、任务编号、文件 / 分片信息、执行结果与错误详情。每页最多 100 条。</p><div id="events"></div><button id="more-logs" hidden>加载更早日志</button></main><script src="/shared/assets/profile.js" defer></script><script src="/shared/assets/logs.js" defer></script></body></html>
