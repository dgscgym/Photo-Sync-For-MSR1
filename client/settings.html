<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户端设置 · PhotoSync</title><link rel="stylesheet" href="/shared/assets/settings.css"><link rel="stylesheet" href="/shared/assets/profile.css"></head><body><header><a href="/client">◈ PhotoSync 客户端</a>__PROFILE__</header><main><a href="/client">← 返回照片库</a><h1>客户端设置</h1><section class="panel"><h2>本机相册上传</h2><p>选择本机相册，文件不会移动。浏览器原型只能在页面开启且授权有效时执行自动同步。</p><button id="choose-folder" class="primary">选择相册文件夹</button><input id="manual-files" type="file" webkitdirectory multiple hidden><button id="sync-now">立即同步</button><label><input id="force-check" type="checkbox"> 本次手动重新校验全部文件（可能重新上传，由服务端 SHA256 去重）</label><div id="local-folders"></div><label><input id="auto-enabled" type="checkbox"> 开启自动同步</label><label for="sync-policy">同步条件</label><select id="sync-policy"><option value="online">联网且页面开启时</option><option value="wifi">仅 Wi-Fi（需浏览器支持网络类型识别）</option><option value="ssid">连接指定 Wi-Fi（原生客户端策略原型）</option></select><label for="wifi-name">指定 Wi-Fi 名称</label><input id="wifi-name" placeholder="例如：Home WiFi"><button id="save-sync" class="primary">保存同步策略</button><p id="sync-state" role="status"></p></section><section class="panel"><h2>设备认证</h2><p>两侧登录均要求密码和验证器。客户端可登记设备验证（指纹 / 面容 / 设备 PIN），在 7 天内替代验证码；到期必须重新输入验证码。设备验证不能用于跳过服务端 2FA。</p><button id="register-device">登记本机设备认证</button><p id="device-state" role="status"></p></section></main><script src="/shared/assets/profile.js" defer></script><script src="/shared/assets/upload.js" defer></script><script src="/shared/assets/webauthn.js" defer></script><script src="/shared/assets/client-settings.js" defer></script></body></html>
